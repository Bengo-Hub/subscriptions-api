basePath: /api/v1
definitions:
  handlers.errorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.listPlansResponse:
    properties:
      count:
        type: integer
      plans:
        items:
          $ref: '#/definitions/plans.SubscriptionPlan'
        type: array
    type: object
  handlers.planResponse:
    properties:
      plan:
        $ref: '#/definitions/plans.SubscriptionPlan'
    type: object
  handlers.rateLimitResponse:
    properties:
      burst_multiplier:
        type: number
      requests_per_window:
        type: integer
      source:
        description: |-
          Source reports which tier of the resolution order produced this result: "plan" (the
          tenant's own plan tier_limits_json), "config" (a RateLimitConfig fallback row), or
          "default" (hardcoded safe floor) — callers can log/monitor this to catch misconfiguration.
        type: string
      window_seconds:
        type: integer
    type: object
  plans.PlanFeature:
    properties:
      createdAt:
        type: string
      featureCode:
        type: string
      id:
        type: string
      isIncluded:
        type: boolean
      limitValue:
        type: integer
      metadata:
        additionalProperties: {}
        type: object
      overageUnitPrice:
        type: number
      planId:
        type: string
    type: object
  plans.SubscriptionPlan:
    properties:
      basePrice:
        type: number
      billingCycle:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      description:
        type: string
      discountRules:
        items:
          additionalProperties: {}
          type: object
        type: array
      features:
        items:
          $ref: '#/definitions/plans.PlanFeature'
        type: array
      freeTrialDays:
        type: integer
      id:
        type: string
      isActive:
        type: boolean
      isPublic:
        type: boolean
      metadata:
        additionalProperties: {}
        type: object
      name:
        type: string
      onetimeAllProductsPrice:
        type: number
      planCode:
        type: string
      planType:
        type: string
      serviceTag:
        type: string
      setupFee:
        type: number
      tierLimits:
        additionalProperties: {}
        type: object
      tierOrder:
        type: integer
      updatedAt:
        type: string
      useSumBasedPricing:
        type: boolean
    type: object
  subscriptions.EntitlementCheck:
    properties:
      entitled:
        type: boolean
      min_plan_code:
        description: |-
          MinPlanCode/MinPlanName/MinPlanTier name the cheapest plan that would unlock this
          product, when NOT entitled — lets the UI prompt a specific upgrade rather than a
          generic "upgrade your plan" message. Nil when Entitled is true or no catalogued plan
          grants the product (nothing to recommend).
        type: string
      min_plan_name:
        type: string
      min_plan_tier:
        type: integer
    type: object
host: pricingapi.codevertexafrica.com
info:
  contact: {}
  description: HTTP API for the Codevertex Subscriptions Service — manages subscription
    plans, features, usage, billing, and tenant entitlements.
  title: Subscriptions API
  version: "1.0"
paths:
  /addons:
    get:
      description: Returns purchasable add-on features (is_included=false) for the
        tenant's current plan, annotated with purchase status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List available add-ons
      tags:
      - Addons
  /addons/{feature_code}:
    delete:
      description: Deactivates a previously purchased add-on feature for the tenant.
      parameters:
      - description: Feature code of the add-on to remove
        in: path
        name: feature_code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove an add-on
      tags:
      - Addons
  /addons/{feature_code}/purchase:
    post:
      consumes:
      - application/json
      description: Initiates purchase of a specific add-on feature. Free add-ons are
        activated immediately; paid add-ons create a Treasury payment intent.
      parameters:
      - description: Feature code of the add-on
        in: path
        name: feature_code
        required: true
        type: string
      - description: Optional return URL for payment redirect
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Purchase an add-on
      tags:
      - Addons
  /admin/feature-catalog:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Upsert feature catalog entry (admin)
      tags:
      - Catalog
  /admin/feature-catalog/{id}:
    delete:
      responses: {}
      security:
      - BearerAuth: []
      summary: Delete feature catalog entry (admin)
      tags:
      - Catalog
  /admin/plans:
    post:
      consumes:
      - application/json
      description: Creates a new subscription plan. Requires platform owner access.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.planResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Create subscription plan (admin)
      tags:
      - Plans
  /admin/plans/{id}:
    delete:
      description: Deletes a subscription plan. Requires platform owner access.
      parameters:
      - description: Plan UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Delete subscription plan (admin)
      tags:
      - Plans
    put:
      consumes:
      - application/json
      description: Updates an existing subscription plan. Requires platform owner
        access.
      parameters:
      - description: Plan UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.planResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Update subscription plan (admin)
      tags:
      - Plans
  /admin/service-charges:
    post:
      consumes:
      - application/json
      description: Creates a new service charge plan. Requires platform owner.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create service charge plan (admin)
      tags:
      - ServiceCharges
  /admin/service-charges/{id}:
    delete:
      description: Deletes a service charge plan by ID. Requires platform owner.
      parameters:
      - description: Service charge plan UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete service charge plan (admin)
      tags:
      - ServiceCharges
    put:
      consumes:
      - application/json
      description: Updates an existing service charge plan. Requires platform owner.
      parameters:
      - description: Service charge plan UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update service charge plan (admin)
      tags:
      - ServiceCharges
  /admin/subscriptions:
    get:
      description: Returns paginated list of all tenant subscriptions. Requires platform
        owner.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20)
        in: query
        name: pageSize
        type: integer
      - description: Filter by status (ACTIVE, TRIAL, EXPIRED, etc.)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all subscriptions (admin)
      tags:
      - Platform
  /admin/subscriptions/{id}:
    put:
      consumes:
      - application/json
      description: Allows platform admin to set trial_ends_at, current_period_end,
        status, or plan_code
      parameters:
      - description: Subscription UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update subscription dates / plan / status (admin)
      tags:
      - Platform
  /admin/subscriptions/{id}/status:
    put:
      consumes:
      - application/json
      description: Updates the status of a tenant subscription. Requires platform
        owner.
      parameters:
      - description: Subscription UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update subscription status (admin)
      tags:
      - Platform
  /admin/tenants:
    get:
      description: Returns paginated tenants with their current subscription status.
        Supports search and status filter.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: pageSize
        type: integer
      - description: Search by tenant name or slug
        in: query
        name: search
        type: string
      - description: Filter by subscription status (ACTIVE, TRIAL, SUSPENDED, etc.)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all tenants (admin)
      tags:
      - Platform
  /admin/tenants/{tenant_id}/exemption:
    patch:
      consumes:
      - application/json
      description: |-
        Flips TenantSubscriptionExempt. An exempt tenant bypasses ALL subscription
        gating platform-wide (every feature unlocked, no limits) without needing a real
        subscription record — for platform-owner-approved cases outside the built-in
        demo/platform-owner slugs (e.g. a sponsored/service-charge pilot tenant).
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Exemption flag
        in: body
        name: body
        required: true
        schema:
          properties:
            exempt:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Grant or revoke a tenant's subscription exemption (platform admin)
      tags:
      - Platform
  /admin/tenants/{tenant_id}/products:
    get:
      description: Returns the product subscriptions attached to the tenant's main
        subscription.
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List a tenant's per-product subscription lines (admin)
      tags:
      - Platform
    post:
      consumes:
      - application/json
      description: Adds/activates a product line for a multi-use-case tenant. When
        planCode is
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Assign a per-product subscription line to a tenant (admin)
      tags:
      - Platform
  /admin/tenants/{tenant_id}/products/{product_code}:
    delete:
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Product code
        in: path
        name: product_code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Remove a per-product subscription line from a tenant (admin)
      tags:
      - Platform
  /admin/tenants/{tenant_id}/purge-confirm:
    post:
      description: |-
        Platform-owner-confirmed, irreversible purge of a suspended/dormant tenant. Emits
        tenant.purge for every service to delete that tenant's data. Guarded by the
        /admin platform-owner middleware; only acts on accounts already queued (pending_purge).
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Confirm deletion of a dormant tenant's data (platform owner)
      tags:
      - Platform
  /admin/tenants/{tenant_id}/subscription:
    post:
      consumes:
      - application/json
      description: Creates or updates a tenant's subscription to the given plan. Requires
        platform owner.
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Assign subscription plan to a tenant (admin)
      tags:
      - Platform
  /admin/tenants/{tenant_id}/subscription/generate-invoice:
    post:
      description: Creates + emails a subscription invoice with a durable pay link.
        Use ?force=true to regenerate for the current period.
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Bypass idempotency and regenerate
        in: query
        name: force
        type: boolean
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Generate a subscription invoice for a tenant (platform owner)
      tags:
      - Platform
  /admin/tenants/{tenant_id}/subscription/invoice:
    get:
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get the latest subscription invoice summary for a tenant (platform
        owner)
      tags:
      - Platform
  /admin/tenants/{tenant_id}/subscription/invoice/pdf:
    get:
      description: Proxies the treasury invoice PDF so the UI needs no treasury auth.
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: Download the latest subscription invoice PDF (platform owner)
      tags:
      - Platform
  /admin/tenants/{tenant_id}/subscription/invoice/resend:
    post:
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Resend the latest subscription invoice email (platform owner)
      tags:
      - Platform
  /billing:
    get:
      description: Returns billing details and payment history for the tenant's subscription
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get billing information
      tags:
      - Billing
  /features:
    get:
      description: Returns the full set of features and limits for the tenant's current
        subscription
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all feature entitlements
      tags:
      - Features
  /features/{code}/check:
    get:
      description: Checks if a specific feature is available for the tenant's subscription.
        Cached for 60s.
      parameters:
      - description: Feature code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Check feature entitlement
      tags:
      - Features
  /features/catalog:
    get:
      description: Returns the platform-wide feature & limit catalog, optionally filtered
        by service or kind. Powers the admin plan builder.
      parameters:
      - description: Filter by service_tag (ordering, pos, inventory, treasury, ...)
        in: query
        name: service
        type: string
      - description: Filter by kind (FEATURE | LIMIT)
        in: query
        name: kind
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List feature catalog
      tags:
      - Catalog
  /health:
    get:
      description: Returns service health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - Health
  /plans:
    get:
      description: Returns all available subscription plans with pricing
      parameters:
      - description: Filter by active status
        in: query
        name: active
        type: boolean
      - description: Filter by service tag (ordering, truload, logistics, inventory,
          erp, pos, marketflow)
        in: query
        name: service
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.listPlansResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      summary: List subscription plans
      tags:
      - Plans
  /plans/{id}:
    get:
      description: Returns a specific subscription plan by UUID
      parameters:
      - description: Plan UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.planResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      summary: Get plan by ID
      tags:
      - Plans
  /plans/code/{code}:
    get:
      description: Returns a specific subscription plan by plan code (e.g. STARTER,
        GROWTH, PROFESSIONAL)
      parameters:
      - description: Plan code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.planResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.errorResponse'
