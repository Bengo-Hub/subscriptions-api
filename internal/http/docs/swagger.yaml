      source:
        description: |-
          Source reports which tier of the resolution order produced this result: "plan" (the
          tenant's own plan tier_limits_json), "config" (a RateLimitConfig fallback row), or
          "default" (hardcoded safe floor) — callers can log/monitor this to catch misconfiguration.
        type: string
      window_seconds:
        type: integer
    type: object
  handlers.refundRequest:
    properties:
      description:
        type: string
      ref_id:
        type: string
      service_tag:
        type: string
      tokens:
        type: integer
    type: object
  handlers.supportAgreementDTO:
    properties:
      amount:
        type: number
      annual_list_price:
        type: number
      billing_cycle:
        type: string
      billing_email:
        type: string
      billing_timing:
        type: string
      collection:
        description: Collection is "business" or "personal" (off the company's books).
        type: string
      currency:
        type: string
      cycle_count:
        type: integer
      cycles:
        items:
          $ref: '#/definitions/handlers.supportCycleDTO'
        type: array
      ends_at:
        type: string
      id:
        type: string
      interval_count:
        type: integer
      interval_unit:
        type: string
      kind:
        type: string
      monthly_equivalent:
        type: number
      name:
        type: string
      next_period_start:
        type: string
      notes:
        type: string
      period_amount:
        type: number
      starts_at:
        type: string
      status:
        type: string
      support_plan_code:
        type: string
      tenant_id:
        type: string
    type: object
  handlers.supportCycleDTO:
    properties:
      agreement_id:
        type: string
      agreement_kind:
        type: string
      agreement_name:
        type: string
      base_price:
        type: number
      blocking:
        type: boolean
      custom_price:
        type: number
      custom_price_reason:
        type: string
      cycle_number:
        type: integer
      due_date:
        type: string
      effective_price:
        type: number
      grace_until:
        type: string
      id:
        type: string
      invoice_number:
        type: string
      invoice_total: {}
      paid_at:
        type: string
      pay_url:
        type: string
      pdf_url:
        type: string
      period_end:
        type: string
      period_start:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      tenant_name:
        type: string
    type: object
  handlers.topUpRequest:
    properties:
      amount_kes:
        type: number
      return_url:
        type: string
      service_tag:
        type: string
    type: object
  plans.PlanFeature:
    properties:
      createdAt:
        type: string
      featureCode:
        type: string
      id:
        type: string
      isIncluded:
        type: boolean
      limitValue:
        type: integer
      metadata:
        additionalProperties: {}
        type: object
      overageUnitPrice:
        type: number
      planId:
        type: string
    type: object
  plans.SubscriptionPlan:
    properties:
      basePrice:
        type: number
      billingCycle:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      description:
        type: string
      discountRules:
        items:
          additionalProperties: {}
          type: object
        type: array
      features:
        items:
          $ref: '#/definitions/plans.PlanFeature'
        type: array
      freeTrialDays:
        type: integer
      id:
        type: string
      isActive:
        type: boolean
      isPublic:
        type: boolean
      metadata:
        additionalProperties: {}
        type: object
      name:
        type: string
      onetimeAllProductsPrice:
        type: number
      planCode:
        type: string
      planType:
        type: string
      serviceTag:
        type: string
      setupFee:
        type: number
      tierLimits:
        additionalProperties: {}
        type: object
      tierOrder:
        type: integer
      updatedAt:
        type: string
      useCase:
        type: string
      useSumBasedPricing:
        type: boolean
    type: object
  subscriptions.EntitlementCheck:
    properties:
      entitled:
        type: boolean
      min_plan_code:
        description: |-
          MinPlanCode/MinPlanName/MinPlanTier name the cheapest plan that would unlock this
          product, when NOT entitled — lets the UI prompt a specific upgrade rather than a
          generic "upgrade your plan" message. Nil when Entitled is true or no catalogued plan
          grants the product (nothing to recommend).
        type: string
      min_plan_name:
        type: string
      min_plan_tier:
        type: integer
    type: object
  subscriptions.ScheduledChangeInfo:
    properties:
      effective_at:
        type: string
      from_plan_code:
        type: string
      from_plan_name:
        type: string
      plan_code:
        type: string
      plan_name:
        type: string
      source:
        type: string
    type: object
  subscriptions.SetupFeePolicy:
    properties:
      enabled:
        type: boolean
      platform:
        type: boolean
      source:
        type: string
      tenant:
        type: boolean
    type: object
  subscriptions.SetupFeeQuote:
    properties:
      has_subscription:
        type: boolean
      setup_fee:
        type: number
    type: object
  subscriptions.SubscriptionResult:
    properties:
      access_status:
        description: |-
          AccessStatus is derived gating state for clients: "active" (full access),
          "grace" (past period end but within the grace window — still accessible, pay soon),
          or "blocked" (expired/cancelled/suspended). GraceEndsAt is set while in grace.
        type: string
      active_products:
        description: |-
          ActiveProducts is the product_code of every currently-active ProductSubscription — minted
          into the JWT active_products claim so the app-switcher can show only activated apps
          without an extra network call. See ActiveProductCodes.
        items:
          type: string
        type: array
      active_service_tags:
        description: |-
          ActiveServiceTags is the set of FeatureDefinition.service_tag values the tenant currently
          has ANY entitlement in (main plan's own service_tag + the service_tag of every feature
          code in Features, including product-overlay and TenantFeatureGrant additions), minted into
          the JWT active_service_tags claim. This is coarser than Features: it answers "is this whole
          module part of the tenant's plan at all" (e.g. "erp"), which a PowerSuite tenant below the
          tier that unlocks its first ERP feature has none of — distinct from activeServiceTags()
          below, which only looks at a plan's single primary service_tag and is wrong for a bundle.
        items:
          type: string
        type: array
      allow_overage:
        description: |-
          AllowOverage is the tenant's opt-in master switch for pay-as-you-go extra usage.
          When true, metered throughput limits may be exceeded and the excess accrues as
          OverageCharge billed on the next renewal.
        type: boolean
      billing_cycle:
        description: |-
          Scenario resolution — lets each service pick whichever plan scenario a tenant chose.
          BillingCycle mirrors the plan (MONTHLY/QUARTERLY/ANNUAL/ONE_TIME).
          BillingMode is the resolved scenario: "recurring" | "one_time" | "service_charge".
          PlanType mirrors the plan's plan_type (TIERED/STANDALONE_SERVICE/BUNDLE/CUSTOM).
          IsPerpetual is true for a paid ONE_TIME licence — non-expiring entitlement; auth
          omits the JWT expiry for these so the subscription gate never blocks them.
        type: string
      billing_mode:
        type: string
      bundle_code:
        type: string
      cancel_reason:
        type: string
      cancelled_at:
        type: string
      current_period_end:
        type: string
      current_period_start:
        type: string
      exempt:
        description: |-
          Exempt is true for tenants the platform has exempted from subscriptions entirely
          (platform/demo tenants + explicitly-flagged tenants). auth-api embeds this as the
          JWT sub_exempt claim so every downstream service bypasses subscription gating.
        type: boolean
      facility_type:
        description: |-
          FacilityType is the resolved plan's presentation-only facility/use-case hint (e.g.
          hospital-api's Afya family: "chemist" | "clinic" | "facility" | "hospital"), read from the
          plan's Metadata JSON (see cmd/seed/plans_hospital.go's afyaTier.facilityType). Empty for
          plan families that don't set it — callers must not assume it's always populated. Additive:
          consumed by hospital-ui's adaptive sidebar (facility-nomenclature.ts) via this same
          GET /subscription / GET /tenants/{id}/subscription response, no new endpoint needed.
        type: string
      features:
        items:
          type: string
        type: array
      grace_ends_at:
        type: string
      id:
        type: string
      is_perpetual:
        type: boolean
      limits:
        additionalProperties:
          type: integer
        type: object
      plan_code:
        type: string
      plan_name:
        type: string
      plan_type:
        type: string
      scheduled_change:
        allOf:
        - $ref: '#/definitions/subscriptions.ScheduledChangeInfo'
        description: ScheduledChange is a plan switch waiting for the next renewal
          date.
      status:
        type: string
      support_fee_due_at:
        type: string
      support_fee_status:
        description: |-
          SupportFeeStatus/SupportFeeDueAt reflect the tenant's CURRENT SupportFeeCycle (perpetual/
          one-time-license tenants only — see internal/ent/schema/support_fee_cycle.go). Empty/nil
          when the tenant has no support-fee obligation at all. Minted into the JWT
          support_fee_status/support_fee_due_at claims for RequireSupportFeeCurrentForMutations.
        type: string
      tenant_id:
        type: string
      tier_order:
        description: |-
          TierOrder is the resolved plan's tier rank (1=Starter, 2=Growth, 3=Professional; higher
          for licenses). Lets clients gate by tier: a feature whose cheapest unlocking plan is at
          tier ≤ TierOrder (same family) is unlocked, so the upgrade wrapper never shows for
          at/below-tier features. 0 for exempt/demo (always unlocked anyway).
        type: integer
      trial_ends_at:
        type: string
      upgrade_trial:
        allOf:
        - $ref: '#/definitions/subscriptions.UpgradeTrialInfo'
        description: |-
          UpgradeTrial is set while a trial of a higher tier runs. PlanCode/TierOrder/Features/Limits
          then describe the trial plan; UpgradeTrial.BasePlanCode is the plan the tenant pays for.
    type: object
  subscriptions.SupportAgreementInput:
    properties:
      amount:
        type: number
      billing_cycle:
        type: string
      billing_email:
        type: string
      billing_timing:
        type: string
      clear_amount:
        type: boolean
      clear_ends_at:
        type: boolean
      collection:
        description: |-
          Collection is "business" (default) or "personal": a personal agreement is the platform
          owner's own engagement, collected into the owner's personal PayHero channel and kept off
          the company's books (its invoices carry off_books in treasury).
        type: string
      currency:
        type: string
      ends_at:
        type: string
      interval_count:
        type: integer
      interval_unit:
        type: string
      kind:
        type: string
      name:
        type: string
      notes:
        type: string
      reschedule_from:
        description: |-
          RescheduleFrom applies a cycle or timing change: "next_period" (default) keeps the current
          period as billed and switches from the next one; "now" cancels the not-yet-invoiced current
          period and starts the new schedule today.
        type: string
      starts_at:
        type: string
      status:
        type: string
    type: object
  subscriptions.UpgradeTrialEligibility:
    properties:
      days:
        type: integer
      eligible:
        type: boolean
      ends_at:
        type: string
      message:
        type: string
      plan_code:
        type: string
      plan_name:
        type: string
      reason:
        type: string
      upgrade_at:
        description: UpgradeAt is the renewal date the upgrade would take effect after
          the trial.
        type: string
    type: object
  subscriptions.UpgradeTrialInfo:
    properties:
      base_plan_code:
        type: string
      base_plan_name:
        type: string
      days_remaining:
        type: integer
      ends_at:
        type: string
      plan_code:
        type: string
      plan_name:
        type: string
      source:
        type: string
      started_at:
        type: string
      tier_order:
        type: integer
    type: object
  subscriptions.UpgradeTrialPolicy:
    properties:
      days:
        type: integer
      days_source:
        type: string
      enabled:
        type: boolean
      enabled_source:
        type: string
      max_days:
        type: integer
      platform:
        $ref: '#/definitions/subscriptions.UpgradeTrialSetting'
      tenant:
        $ref: '#/definitions/subscriptions.UpgradeTrialSetting'
    type: object
  subscriptions.UpgradeTrialRecord:
    properties:
      base_plan_code:
        type: string
      ended_at:
        type: string
      outcome:
        type: string
      plan_code:
        type: string
      started_at:
        type: string
    type: object
  subscriptions.UpgradeTrialSetting:
    properties:
      days:
        type: integer
      enabled:
        type: boolean
      updated_at:
        type: string
    type: object
  subscriptions.UpgradeTrialStatus:
    properties:
      active:
        $ref: '#/definitions/subscriptions.UpgradeTrialInfo'
      eligibility:
        $ref: '#/definitions/subscriptions.UpgradeTrialEligibility'
      history:
        items:
          $ref: '#/definitions/subscriptions.UpgradeTrialRecord'
        type: array
      policy:
        $ref: '#/definitions/subscriptions.UpgradeTrialPolicy'
      scheduled_change:
        $ref: '#/definitions/subscriptions.ScheduledChangeInfo'
      used:
        items:
          type: string
        type: array
    type: object
host: pricingapi.codevertexafrica.com
info:
  contact: {}
  description: HTTP API for the Codevertex Subscriptions Service — manages subscription
    plans, features, usage, billing, and tenant entitlements.
  title: Subscriptions API
  version: "1.0"
paths:
  /admin/credits/overview:
    get:
      description: 'For each service: tenants activated, units sold and consumed this
        UTC month, bundle revenue this month, overage accrued this month, overage
        still unpaid, and tenants at or over the cap.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credits.AdminOverview'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Platform totals per credit service (platform owner)
      tags:
      - Credits
  /admin/credits/settings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credits.AdminSettings'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Platform messaging settings (platform owner)
      tags:
      - Credits
    put:
      consumes:
      - application/json
      description: overage_cap_kes is the most unpaid overage in KES a tenant can
        run up before SMS and WhatsApp sends pause. 0 means no cap, the maximum is
        1,000,000, two decimal places at most. Takes effect immediately on the serving
        replica and within one minute on the others.
      parameters:
      - description: Settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.creditAdminSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credits.AdminSettings'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change platform messaging settings (platform owner)
      tags:
      - Credits
  /admin/credits/tenants:
    get:
      description: 'One row per tenant with a wallet, activation or overage for the
        service: plan, bundle balance, tier and renewal, pending overage against the
        cap, units used this UTC month and last activity. Sorted by last activity.'
      parameters:
      - description: sms, whatsapp or ai_credits
        in: query
        name: service
        required: true
        type: string
      - description: Search tenant name or slug
        in: query
        name: q
        type: string
      - description: active, capped, not_activated or exempt
        in: query
        name: status
        type: string
      - description: Default 25, max 100
        in: query
        name: limit
        type: integer
      - description: Rows to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credits.AdminTenantPage'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tenants holding a messaging or AI credit position (platform owner)
      tags:
      - Credits
  /admin/feature-catalog:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Upsert feature catalog entry (admin)
      tags:
      - Catalog
  /admin/feature-catalog/{id}:
    delete:
      responses: {}
      security:
      - BearerAuth: []
      summary: Delete feature catalog entry (admin)
      tags:
      - Catalog
  /admin/plans:
    post:
      consumes:
      - application/json
      description: Creates a new subscription plan. Requires platform owner access.
      produces:
      - application/json
      responses:
