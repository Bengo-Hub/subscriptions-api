basePath: /api/v1
definitions:
  github_com_bengobox_subscription-service_internal_modules_plans.PlanFeature:
    properties:
      createdAt:
        type: string
      featureCode:
        type: string
      id:
        type: string
      isIncluded:
        type: boolean
      limitValue:
        type: integer
      metadata:
        additionalProperties: {}
        type: object
      overageUnitPrice:
        format: float64
        type: number
      planID:
        type: string
    type: object
  github_com_bengobox_subscription-service_internal_modules_plans.SubscriptionPlan:
    properties:
      basePrice:
        format: float64
        type: number
      billingCycle:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      description:
        type: string
      discountRules:
        items:
          additionalProperties: {}
          type: object
        type: array
      features:
        items:
          $ref: '#/definitions/github_com_bengobox_subscription-service_internal_modules_plans.PlanFeature'
        type: array
      id:
        type: string
      isActive:
        type: boolean
      isPublic:
        type: boolean
      metadata:
        additionalProperties: {}
        type: object
      name:
        type: string
      onetimeAllProductsPrice:
        format: float64
        type: number
      planCode:
        type: string
      tierLimits:
        additionalProperties: {}
        type: object
      tierOrder:
        type: integer
      updatedAt:
        type: string
      useSumBasedPricing:
        type: boolean
    type: object
  internal_http_handlers.errorResponse:
    properties:
      error:
        type: string
    type: object
  internal_http_handlers.listPlansResponse:
    properties:
      count:
        type: integer
      plans:
        items:
          $ref: '#/definitions/github_com_bengobox_subscription-service_internal_modules_plans.SubscriptionPlan'
        type: array
    type: object
  internal_http_handlers.planResponse:
    properties:
      plan:
        $ref: '#/definitions/github_com_bengobox_subscription-service_internal_modules_plans.SubscriptionPlan'
    type: object
host: pricingapi.codevertexafrica.com
info:
  contact: {}
  description: HTTP API for the Codevertex Subscriptions Service — manages subscription
    plans, features, usage, billing, and tenant entitlements.
  title: Subscriptions API
  version: "1.0"
paths:
  /admin/plans:
    post:
      consumes:
      - application/json
      description: Creates a new subscription plan. Requires platform owner access.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_http_handlers.planResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Create subscription plan (admin)
      tags:
      - Plans
  /admin/plans/{id}:
    delete:
      description: Deletes a subscription plan. Requires platform owner access.
      parameters:
      - description: Plan UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Delete subscription plan (admin)
      tags:
      - Plans
    put:
      consumes:
      - application/json
      description: Updates an existing subscription plan. Requires platform owner
        access.
      parameters:
      - description: Plan UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handlers.planResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Update subscription plan (admin)
      tags:
      - Plans
  /admin/subscriptions:
    get:
      description: Returns paginated list of all tenant subscriptions. Requires platform
        owner.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20)
        in: query
        name: pageSize
        type: integer
      - description: Filter by status (ACTIVE, TRIAL, EXPIRED, etc.)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all subscriptions (admin)
      tags:
      - Platform
  /billing:
    get:
      description: Returns billing details and payment history for the tenant's subscription
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get billing information
      tags:
      - Billing
  /features:
    get:
      description: Returns the full set of features and limits for the tenant's current
        subscription
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all feature entitlements
      tags:
      - Features
  /features/{code}/check:
    get:
      description: Checks if a specific feature is available for the tenant's subscription.
        Cached for 60s.
      parameters:
      - description: Feature code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Check feature entitlement
      tags:
      - Features
  /health:
    get:
      description: Returns service health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - Health
  /plans:
    get:
      description: Returns all available subscription plans with pricing
      parameters:
      - description: Filter by active status
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handlers.listPlansResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      summary: List subscription plans
      tags:
      - Plans
  /plans/{id}:
    get:
      description: Returns a specific subscription plan by UUID
      parameters:
      - description: Plan UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handlers.planResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      summary: Get plan by ID
      tags:
      - Plans
  /plans/code/{code}:
    get:
      description: Returns a specific subscription plan by plan code (e.g. STARTER,
        GROWTH, PROFESSIONAL)
      parameters:
      - description: Plan code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handlers.planResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      summary: Get plan by code
      tags:
      - Plans
  /platform/stats:
    get:
      description: 'Returns aggregated platform stats: total plans, subscriptions,
        MRR. Requires platform owner.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get platform statistics (admin)
      tags:
      - Platform
  /service-charges/plans:
    get:
      description: Returns all active service charge plans, optionally filtered by
        service
      parameters:
      - description: Filter by service name
        in: query
        name: service
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List service charge plans
      tags:
      - ServiceCharges
  /service-charges/plans/{code}:
    get:
      description: Returns a specific service charge plan by code
      parameters:
      - description: Service charge plan code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get service charge plan
      tags:
      - ServiceCharges
  /subscription:
    get:
      description: Returns the current tenant's subscription with plan details
      parameters:
      - description: Tenant UUID
        in: header
        name: X-Tenant-ID
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current subscription
      tags:
      - Subscriptions
    post:
      consumes:
      - application/json
      description: Provisions a new subscription for the tenant (starts trial if applicable)
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create subscription
      tags:
      - Subscriptions
  /subscription/initiate:
    post:
      consumes:
      - application/json
      description: Starts the subscription provisioning process for a new tenant
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Initiate subscription
      tags:
      - Subscriptions
  /subscription/plan:
    put:
      consumes:
      - application/json
      description: Upgrades or downgrades the tenant's subscription plan
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change subscription plan
      tags:
      - Subscriptions
  /subscription/settings:
    get:
      description: Returns the current tenant's subscription settings (auto-renew,
        payment method, etc.)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get subscription settings
      tags:
      - Subscriptions
    put:
      consumes:
      - application/json
      description: Updates the current tenant's subscription settings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update subscription settings
      tags:
      - Subscriptions
  /subscriptions/expiring:
    get:
      description: Returns subscriptions expiring within the specified number of days.
        Used by notifications-api.
      parameters:
      - description: Days until expiry (default 7)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List expiring subscriptions (S2S)
      tags:
      - Subscriptions
  /tenants/{tenant_id}/subscription:
    get:
      description: Returns a tenant's subscription by tenant UUID. Used by auth-api
        for JWT enrichment.
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get subscription by tenant ID (S2S)
      tags:
      - Subscriptions
  /usage:
    get:
      description: Returns aggregated usage metrics for the tenant within a date range
      parameters:
      - description: Start date (RFC3339)
        in: query
        name: from
        type: string
      - description: End date (RFC3339)
        in: query
        name: to
        type: string
      - description: Filter by service name
        in: query
        name: service
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get usage summary
      tags:
      - Usage
  /usage/report:
    post:
      consumes:
      - application/json
      description: Ingests a usage event from microservices for tracking consumption
        against subscription limits
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Report usage
      tags:
      - Usage
schemes:
- https
- http
securityDefinitions:
  ApiKeyAuth:
    description: Service-to-service API key
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: JWT Bearer token from SSO (e.g. "Bearer eyJ...")
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
