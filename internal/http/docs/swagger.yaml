  /s2s/credits/{service}/consume:
    post:
      consumes:
      - application/json
      description: 'Spends units in order: a live legacy allowance, the bundle balance,
        then overage (SMS, or WhatsApp while a legacy tier runs) up to the platform
        cap. A WhatsApp send names its category service and spends only that wallet.
        Idempotent per key. Answers 200 with allowed=false and a reason when refused,
        so callers can tell a refusal from a failure (5xx) and never send free on
        a failure.'
      parameters:
      - description: sms, whatsapp_marketing, whatsapp_utility, whatsapp_authentication,
          whatsapp_service or ai_credits (whatsapp is an alias of whatsapp_utility)
        in: path
