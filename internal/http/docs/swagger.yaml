basePath: /api/v1
definitions:
  billing.DeductResult:
    properties:
      allowed:
        type: boolean
      new_balance:
        type: integer
      tokens_charged:
        type: integer
    type: object
  billing.WalletSnapshot:
    properties:
      balance:
        type: integer
      lifetime_granted:
        type: integer
      low_balance:
        type: boolean
      low_balance_threshold:
        type: integer
    type: object
  handlers.checkUsageRequest:
    properties:
      metric_type:
        type: string
      value:
        type: number
    type: object
  handlers.deductRequest:
    properties:
      description:
        type: string
      endpoint_pattern:
        type: string
      ref_id:
        type: string
      ref_type:
        type: string
      service_tag:
        type: string
    type: object
  handlers.errorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.estimateRequest:
    properties:
      avg_sales_per_day:
        description: 'Shortcut: assumes every call is a sales-transmission-weight
          call (the common "N sales/day" case).'
        type: integer
      calls_per_day:
        additionalProperties:
          type: integer
        description: endpoint_pattern -> calls/day
        type: object
      days_per_month:
        type: integer
      service_tag:
        type: string
    type: object
  handlers.estimateResponse:
    properties:
      plans_compared:
        items:
          $ref: '#/definitions/handlers.planComparison'
        type: array
      recommended_plan:
        type: string
      tokens_per_month:
        type: integer
    type: object
  handlers.listPlansResponse:
    properties:
      count:
        type: integer
      plans:
        items:
          $ref: '#/definitions/plans.SubscriptionPlan'
        type: array
    type: object
  handlers.planComparison:
    properties:
      covers_estimate:
        type: boolean
      included_tokens:
        type: integer
      monthly_price_kes:
        type: number
      name:
        type: string
      plan_code:
        type: string
      projected_topup_kes:
        type: number
      token_price_kes:
        type: number
    type: object
  handlers.planResponse:
    properties:
      plan:
        $ref: '#/definitions/plans.SubscriptionPlan'
    type: object
  handlers.rateLimitResponse:
    properties:
      burst_multiplier:
        type: number
      requests_per_window:
        type: integer
      source:
        description: |-
          Source reports which tier of the resolution order produced this result: "plan" (the
          tenant's own plan tier_limits_json), "config" (a RateLimitConfig fallback row), or
          "default" (hardcoded safe floor) — callers can log/monitor this to catch misconfiguration.
        type: string
      window_seconds:
        type: integer
    type: object
  handlers.refundRequest:
    properties:
      description:
        type: string
      ref_id:
        type: string
      service_tag:
        type: string
      tokens:
        type: integer
    type: object
  handlers.supportAgreementDTO:
    properties:
      amount:
        type: number
      annual_list_price:
        type: number
      billing_cycle:
        type: string
      billing_email:
        type: string
      billing_timing:
        type: string
      collection:
        description: Collection is "business" or "personal" (off the company's books).
        type: string
      currency:
        type: string
      cycle_count:
        type: integer
      cycles:
        items:
          $ref: '#/definitions/handlers.supportCycleDTO'
        type: array
      ends_at:
        type: string
      id:
        type: string
      interval_count:
        type: integer
      interval_unit:
        type: string
      kind:
        type: string
      monthly_equivalent:
        type: number
      name:
        type: string
      next_period_start:
        type: string
      notes:
        type: string
      period_amount:
        type: number
      starts_at:
        type: string
      status:
        type: string
      support_plan_code:
        type: string
      tenant_id:
        type: string
    type: object
  handlers.supportCycleDTO:
    properties:
      agreement_id:
        type: string
      agreement_kind:
        type: string
      agreement_name:
        type: string
      base_price:
        type: number
      blocking:
        type: boolean
      custom_price:
        type: number
      custom_price_reason:
        type: string
      cycle_number:
        type: integer
      due_date:
        type: string
      effective_price:
        type: number
      grace_until:
        type: string
      id:
        type: string
      invoice_number:
        type: string
      invoice_total: {}
      paid_at:
        type: string
      pay_url:
        type: string
      pdf_url:
        type: string
      period_end:
        type: string
      period_start:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      tenant_name:
        type: string
    type: object
  handlers.topUpRequest:
    properties:
      amount_kes:
        type: number
      return_url:
        type: string
      service_tag:
        type: string
    type: object
  plans.PlanFeature:
    properties:
      createdAt:
        type: string
      featureCode:
        type: string
      id:
        type: string
      isIncluded:
        type: boolean
      limitValue:
        type: integer
      metadata:
        additionalProperties: {}
        type: object
      overageUnitPrice:
        type: number
      planId:
        type: string
    type: object
  plans.SubscriptionPlan:
    properties:
      basePrice:
        type: number
      billingCycle:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      description:
        type: string
      discountRules:
        items:
          additionalProperties: {}
          type: object
        type: array
      features:
        items:
          $ref: '#/definitions/plans.PlanFeature'
        type: array
      freeTrialDays:
        type: integer
      id:
        type: string
      isActive:
        type: boolean
      isPublic:
        type: boolean
      metadata:
        additionalProperties: {}
        type: object
      name:
        type: string
      onetimeAllProductsPrice:
        type: number
      planCode:
        type: string
      planType:
        type: string
      serviceTag:
        type: string
      setupFee:
        type: number
      tierLimits:
        additionalProperties: {}
        type: object
      tierOrder:
        type: integer
      updatedAt:
        type: string
      useCase:
        type: string
      useSumBasedPricing:
        type: boolean
    type: object
  subscriptions.EntitlementCheck:
    properties:
      entitled:
        type: boolean
      min_plan_code:
        description: |-
          MinPlanCode/MinPlanName/MinPlanTier name the cheapest plan that would unlock this
          product, when NOT entitled — lets the UI prompt a specific upgrade rather than a
          generic "upgrade your plan" message. Nil when Entitled is true or no catalogued plan
          grants the product (nothing to recommend).
        type: string
      min_plan_name:
        type: string
      min_plan_tier:
        type: integer
    type: object
  subscriptions.SupportAgreementInput:
    properties:
      amount:
        type: number
      billing_cycle:
        type: string
      billing_email:
        type: string
      billing_timing:
        type: string
      clear_amount:
        type: boolean
      clear_ends_at:
        type: boolean
      collection:
        description: |-
          Collection is "business" (default) or "personal": a personal agreement is the platform
          owner's own engagement, collected into the owner's personal PayHero channel and kept off
          the company's books (its invoices carry off_books in treasury).
        type: string
      currency:
        type: string
      ends_at:
        type: string
      interval_count:
        type: integer
      interval_unit:
        type: string
      kind:
        type: string
      name:
        type: string
      notes:
        type: string
      reschedule_from:
        description: |-
          RescheduleFrom applies a cycle or timing change: "next_period" (default) keeps the current
          period as billed and switches from the next one; "now" cancels the not-yet-invoiced current
          period and starts the new schedule today.
        type: string
      starts_at:
        type: string
      status:
        type: string
    type: object
host: pricingapi.codevertexafrica.com
info:
  contact: {}
  description: HTTP API for the Codevertex Subscriptions Service — manages subscription
    plans, features, usage, billing, and tenant entitlements.
  title: Subscriptions API
  version: "1.0"
paths:
  /addons:
    get:
      description: Returns purchasable add-on features (is_included=false) for the
        tenant's current plan, annotated with purchase status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List available add-ons
      tags:
      - Addons
  /addons/{feature_code}:
    delete:
      description: Deactivates a previously purchased add-on feature for the tenant.
      parameters:
      - description: Feature code of the add-on to remove
        in: path
        name: feature_code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove an add-on
      tags:
      - Addons
  /addons/{feature_code}/purchase:
    post:
      consumes:
      - application/json
      description: Initiates purchase of a specific add-on feature. Free add-ons are
        activated immediately; paid add-ons create a Treasury payment intent.
      parameters:
      - description: Feature code of the add-on
        in: path
        name: feature_code
        required: true
        type: string
      - description: Optional return URL for payment redirect
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Purchase an add-on
      tags:
      - Addons
  /admin/feature-catalog:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Upsert feature catalog entry (admin)
      tags:
      - Catalog
  /admin/feature-catalog/{id}:
    delete:
      responses: {}
      security:
      - BearerAuth: []
      summary: Delete feature catalog entry (admin)
      tags:
      - Catalog
  /admin/plans:
    post:
      consumes:
      - application/json
      description: Creates a new subscription plan. Requires platform owner access.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.planResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Create subscription plan (admin)
      tags:
      - Plans
  /admin/plans/{id}:
    delete:
      description: Deletes a subscription plan. Requires platform owner access.
      parameters:
      - description: Plan UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Delete subscription plan (admin)
      tags:
      - Plans
    put:
      consumes:
      - application/json
      description: Updates an existing subscription plan. Requires platform owner
        access.
      parameters:
      - description: Plan UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.planResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      security:
      - BearerAuth: []
      summary: Update subscription plan (admin)
      tags:
      - Plans
  /admin/service-charges:
    post:
      consumes:
      - application/json
      description: Creates a new service charge plan. Requires platform owner.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create service charge plan (admin)
      tags:
      - ServiceCharges
  /admin/service-charges/{id}:
    delete:
      description: Deletes a service charge plan by ID. Requires platform owner.
      parameters:
      - description: Service charge plan UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete service charge plan (admin)
      tags:
      - ServiceCharges
    put:
      consumes:
      - application/json
      description: Updates an existing service charge plan. Requires platform owner.
      parameters:
      - description: Service charge plan UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update service charge plan (admin)
      tags:
      - ServiceCharges
  /admin/subscriptions:
    get:
      description: Returns paginated list of all tenant subscriptions. Requires platform
        owner.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20)
        in: query
        name: pageSize
        type: integer
      - description: Filter by status (ACTIVE, TRIAL, EXPIRED, etc.)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all subscriptions (admin)
      tags:
      - Platform
  /admin/subscriptions/{id}:
    put:
      consumes:
      - application/json
      description: Allows platform admin to set trial_ends_at, current_period_end,
        status, or plan_code
      parameters:
      - description: Subscription UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update subscription dates / plan / status (admin)
      tags:
      - Platform
  /admin/subscriptions/{id}/status:
    put:
      consumes:
      - application/json
      description: Updates the status of a tenant subscription. Requires platform
        owner.
      parameters:
      - description: Subscription UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update subscription status (admin)
      tags:
      - Platform
  /admin/support-agreements/{id}:
    put:
      consumes:
      - application/json
      description: |-
        Partial update. A cycle or timing change applies from the next period
        (reschedule_from=next_period) or restarts today (reschedule_from=now, cancelling
        the current not-yet-invoiced period). status PAUSED stops new periods; ENDED also
        cancels future not-yet-invoiced periods. Invoiced charges stay payable.
      parameters:
      - description: Agreement UUID
        in: path
        name: id
        required: true
        type: string
      - description: Changes
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/subscriptions.SupportAgreementInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.supportAgreementDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a support agreement (admin)
      tags:
      - Platform
  /admin/support-fee-cycles:
    get:
      description: |-
        Paginated, newest due first. Filters: status (comma list of PENDING, INVOICED,
        OVERDUE, PAID, WAIVED), tenant_id, agreement_id, kind (STANDARD or SPECIAL),
        blocking=true (overdue past grace). Includes the outstanding totals for the filter.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List support charges across tenants (admin receivables)
      tags:
      - Platform
  /admin/support-fee-cycles/{id}:
    put:
      consumes:
      - application/json
      description: |-
        custom_price / clear_custom_price override this period's amount (a sales-agreed
        price). status PAID records an offline payment; WAIVED excuses the charge. Either
        lifts the mutation block on the tenant's next token refresh.
      parameters:
      - description: SupportFeeCycle UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.supportCycleDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reprice, waive or record an offline payment for one support charge
        (admin)
      tags:
      - Platform
  /admin/support-fee-cycles/{id}/invoice:
    post:
      parameters:
      - description: SupportFeeCycle UUID
        in: path
        name: id
        required: true
        type: string
      - description: Re-issue even if already invoiced
        in: query
        name: force
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.supportCycleDTO'
      security:
      - BearerAuth: []
      summary: Issue (or with force=true re-issue) the invoice for one support charge
        (admin)
      tags:
      - Platform
  /admin/tenants:
    get:
      description: Returns paginated tenants with their current subscription status.
        Supports search and status filter.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: pageSize
        type: integer
      - description: Search by tenant name or slug
        in: query
        name: search
        type: string
      - description: Filter by subscription status (ACTIVE, TRIAL, SUSPENDED, etc.)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all tenants (admin)
      tags:
      - Platform
  /admin/tenants/{tenant_id}/exemption:
    patch:
      consumes:
      - application/json
      description: |-
        Flips TenantSubscriptionExempt. An exempt tenant bypasses ALL subscription
        gating platform-wide (every feature unlocked, no limits) without needing a real
        subscription record — for platform-owner-approved cases outside the built-in
        demo/platform-owner slugs (e.g. a sponsored/service-charge pilot tenant).
      parameters:
      - description: Tenant ID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Exemption flag
        in: body
        name: body
        required: true
        schema:
          properties:
            exempt:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Grant or revoke a tenant's subscription exemption (platform admin)
      tags:
      - Platform
  /admin/tenants/{tenant_id}/feature-grants:
    get:
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List a tenant's platform-admin add-on feature grants
      tags:
      - Platform
    post:
      consumes:
      - application/json
      description: |-
        Unlocks one feature_definitions code for a tenant independent of its
        subscription plan (e.g. multi_branch_pricing, batch_period_pricing, flash_sale).
        The tenant's own settings page still gates the actual on/off switch.
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      produces:
