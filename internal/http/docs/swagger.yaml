      summary: Tenant upgrade trial status (admin)
      tags:
      - Platform
    post:
      consumes:
      - application/json
      description: |-
        Starts a trial of plan_code for the tenant, regardless of the policy switch or an
        earlier trial of the same plan. days (1 to 90) overrides the configured length.
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: '{plan_code, days}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subscriptions.SubscriptionResult'
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Grant an upgrade trial (admin)
      tags:
      - Platform
