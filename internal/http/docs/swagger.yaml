      tags:
      - Billing
  /subscription/payment-method/setup:
    post:
      description: Creates a Paystack payment intent so the tenant can register a
        card for subscription auto-renewal
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Setup payment method for auto-renewal
      tags:
      - Billing
  /subscription/plan:
    put:
      consumes:
      - application/json
      description: |-
        Moves the tenant to another plan. A tenant's move to a dearer plan is scheduled for
        the next renewal date (the renewal invoice bills it); a move to a plan costing the
        same or less applies at once. The platform owner's change always applies at once.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change subscription plan
      tags:
      - Subscriptions
  /subscription/plan-change:
    delete:
      description: Drops the plan change waiting for the next renewal date.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subscriptions.SubscriptionResult'
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cancel the scheduled plan change
      tags:
      - Subscriptions
  /subscription/referral-code:
    get:
      description: Returns (creating if needed) the calling tenant's shareable Type-A
        referral code.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the tenant's referral code
      tags:
      - Subscriptions
  /subscription/settings:
    get:
      description: Returns the current tenant's subscription settings (auto-renew,
        payment method, etc.)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get subscription settings
      tags:
      - Subscriptions
    put:
      consumes:
      - application/json
      description: Updates the current tenant's subscription settings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update subscription settings
      tags:
      - Subscriptions
  /subscription/setup-fee:
    get:
      description: |-
        The one-time setup fee a checkout for plan_code charges the calling tenant, before any
        billing period waiver: 0 once the tenant has paid for a period or the fee is off for it.
      parameters:
      - description: Plan to quote
        in: query
        name: plan_code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subscriptions.SetupFeeQuote'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Setup fee a checkout will charge
      tags:
      - Subscriptions
  /subscription/standing-order:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Cancel the M-Pesa standing order
      tags:
      - Billing
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get the M-Pesa standing order for the subscription
      tags:
      - Billing
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Pay the subscription automatically by M-Pesa standing order
      tags:
      - Billing
  /subscription/standing-order/quote:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Standing order terms (amount, frequency, start date, payee) before
        authorising
      tags:
      - Billing
  /subscription/upgrade-trial:
    delete:
      description: |-
        Ends the trial now. The tenant stays on the plan it pays for and the upgrade the
        trial scheduled is cancelled.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subscriptions.SubscriptionResult'
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: End the running upgrade trial
      tags:
      - Subscriptions
    get:
      description: |-
        Whether upgrade trials are on for the tenant, any running trial or scheduled plan
        change, past trials and, with plan_code, whether a trial of that plan can start.
      parameters:
      - description: Plan to check eligibility for
        in: query
        name: plan_code
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subscriptions.UpgradeTrialStatus'
      security:
      - BearerAuth: []
      summary: Upgrade trial status
      tags:
      - Subscriptions
    post:
      consumes:
      - application/json
      description: |-
        Gives the tenant a higher tier of its current product for the configured number of
        days and schedules the upgrade for the first renewal date after the trial ends.
      parameters:
      - description: '{plan_code}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subscriptions.SubscriptionResult'
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Start an upgrade trial
      tags:
      - Subscriptions
  /subscriptions/expiring:
    get:
      description: Returns subscriptions expiring within the specified number of days.
        Used by notifications-api.
      parameters:
      - description: Days until expiry (default 7)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List expiring subscriptions (S2S)
      tags:
      - Subscriptions
  /tenants/{tenant_id}/rate-limit:
    get:
      description: Resolves the requests/minute ceiling a calling service should enforce
        for a tenant against a service+endpoint pattern. Used by treasury-api's external
        eTIMS API middleware.
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Calling service name, e.g. treasury-api
        in: query
        name: service_name
        required: true
        type: string
      - description: Endpoint pattern, e.g. /api/v1/external/etims/*
        in: query
        name: endpoint
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.rateLimitResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Resolve effective rate limit (S2S)
      tags:
      - Subscriptions
  /tenants/{tenant_id}/subscription:
    get:
      description: Returns a tenant's subscription by tenant UUID. Used by auth-api
        for JWT enrichment.
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get subscription by tenant ID (S2S)
      tags:
      - Subscriptions
  /tenants/{tenant_id}/tokens/balance:
    get:
      description: Returns the current token balance for a tenant+service. S2S (treasury-api's
        external eTIMS middleware) or tenant-facing.
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Defaults to etims_api
        in: query
        name: service_tag
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/billing.WalletSnapshot'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get API token wallet balance
      tags:
      - Subscriptions
  /tenants/{tenant_id}/tokens/deduct:
    post:
      consumes:
      - application/json
      description: Atomically deducts the resolved token cost for endpoint_pattern
        from the tenant's wallet, refusing (402) if the balance is insufficient. Called
        BEFORE the metered operation runs, not after — see treasury-api's ExternalAPIKeyAuth
        middleware.
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Deduct request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.deductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/billing.DeductResult'
        "402":
          description: insufficient_tokens
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Spend API tokens for one call (S2S)
      tags:
      - Subscriptions
  /tenants/{tenant_id}/tokens/estimate:
    post:
      consumes:
      - application/json
      description: Given expected call volume, computes tokens/month from the token-cost
        registry and compares against every published plan for service_tag, so a tenant
        can buy from a point of information instead of blindly.
      parameters:
      - description: Estimate request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.estimateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.estimateResponse'
      summary: Estimate monthly API token consumption and recommend a plan
      tags:
      - Subscriptions
  /tenants/{tenant_id}/tokens/refund:
    post:
      consumes:
      - application/json
      description: Reverses a Deduct when the downstream operation turned out not
        to have done real work (e.g. the caller's request failed validation before
        reaching KRA) — called by treasury-api's ExternalAPIKeyAuth middleware after
        the handler runs, only for status codes that indicate no real KRA attempt
        happened.
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Refund request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.refundRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Refund previously-deducted API tokens (S2S)
      tags:
      - Subscriptions
  /tenants/{tenant_id}/tokens/topup:
    post:
      consumes:
      - application/json
      description: Creates a Treasury payment intent for a token top-up; tokens are
        credited once payment is confirmed (see the api_token_topup NATS consumer
        branch).
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Top-up request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.topUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Buy API tokens (self-serve)
      tags:
      - Subscriptions
  /tenants/{tenant_id}/tokens/transactions:
    get:
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Defaults to etims_api
        in: query
        name: service_tag
        type: string
      - description: Default 50, max 200
        in: query
        name: limit
        type: integer
      - description: Rows to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List API token wallet transactions
      tags:
      - Subscriptions
  /usage:
    get:
      description: Returns aggregated usage metrics with plan limits for the current
        billing period
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get usage summary
      tags:
      - Usage
  /usage/check:
    post:
      consumes:
      - application/json
      description: |-
        Answers whether value more units of a metric are allowed, without recording
        anything. Services call it before starting an action that is counted later from
        its completion event (pos-api checks before a sale; the sale counts as an order
        when pos.sale.finalized arrives). 200 when allowed (also when over the limit with
        extra usage enabled), 402 with the limit-reached body otherwise. used in the 402
        body is the current total, not including the attempted unit.
      parameters:
      - description: Metric and units (value defaults to 1)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.checkUsageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "402":
          description: Payment Required
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Check a metered limit without counting
      tags:
      - Usage
  /usage/report:
    post:
      consumes:
      - application/json
      description: Ingests a usage event from microservices for tracking consumption
        against subscription limits
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Usage limit exceeded — X-RateLimit-Limit, X-RateLimit-Remaining,
            X-RateLimit-Reset headers included
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Report usage
      tags:
      - Usage
  /usage/summary:
    get:
      description: Returns key usage metrics as named objects for the dashboard
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Get usage dashboard summary
      tags:
      - Usage
  /webhooks/treasury/payment-status:
    post:
      consumes:
      - application/json
      description: Receives payment completion/failure events from Treasury to activate
        or suspend subscriptions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Treasury payment webhook (S2S)
      tags:
      - Webhooks
schemes:
- https
- http
securityDefinitions:
  ApiKeyAuth:
    description: Service-to-service API key
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: JWT Bearer token from SSO (e.g. "Bearer eyJ...")
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
