    put:
      consumes:
      - application/json
      description: |-
        enabled and days override the platform setting for this tenant; null (or absent)
        removes that override so the tenant follows the platform setting.
      parameters:
      - description: Tenant UUID
        in: path
        name: tenant_id
        required: true
        type: string
      - description: '{enabled: bool|null, days: int|null}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
